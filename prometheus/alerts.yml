groups:
  - name: simplon_rag_alerts
    rules:
      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_highr_seconds_bucket[5m]))) > 10
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "Latence p95 trop haute ({{ $value }}s) sur /messages"
          runbook: "Vérifier les logs Ollama, possible surcharge du modèle LLM"

      - alert: HighErrorRate5xx
        expr: sum(rate(http_requests_total{status=~"5xx"}[5m])) / sum(rate(http_requests_total[5m])) * 100 > 5
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Taux d'erreurs 5xx élevé ({{ $value }}%) "
          runbook: "Vérifier les logs API : docker logs simplon_rag_api"