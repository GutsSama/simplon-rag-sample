
services:
  postgres:
    image: ankane/pgvector
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: rag_db
      POSTGRES_USER: rag_user
      POSTGRES_PASSWORD: rag_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U rag_user -d rag_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build: 
      context: ./api
      dockerfile: Dockerfile
      target: dev
    container_name: simplon_rag_api
    environment:
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_DB=rag_db
      - POSTGRES_USER=rag_user
      - POSTGRES_PASSWORD=rag_password
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
      - LANGFUSE_PUBLIC_KEY=${LANGFUSE_PUBLIC_KEY:-pk-lf-dummy}
      - LANGFUSE_SECRET_KEY=${LANGFUSE_SECRET_KEY:-sk-lf-dummy}
      - LANGFUSE_HOST=http://langfuse:3000
    ports:
      - "8000:8000"
    volumes:
      - ./api/src:/app/src
      - ./api/main.py:/app/main.py
      - ./api/data/alembic:/app/data/alembic
      - ./api/validate_rag.py:/app/validate_rag.py
      - ./data/docs:/app/data/docs
    depends_on:
      postgres:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: simplon_rag_frontend
    environment:
      - API_BASE_URL=http://api:8000/api/v1
    ports:
      - "8501:8501"
    volumes:
      - ./frontend:/app
    depends_on:
      api:
        condition: service_healthy

  # --- OBSERVABILITY STACK ---

  prometheus:
    image: prom/prometheus:latest
    container_name: simplon_rag_prometheus
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - ./monitoring/prometheus/alert_rules.yml:/etc/prometheus/alert_rules.yml
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    depends_on:
      - alertmanager

  alertmanager:
    image: prom/alertmanager:latest
    container_name: simplon_rag_alertmanager
    volumes:
      - ./monitoring/prometheus/alertmanager.yml:/etc/alertmanager/alertmanager.yml
    command:
      - '--config.file=/etc/alertmanager/alertmanager.yml'
    ports:
      - "9093:9093"
    depends_on:
      - discord-bridge
      - telegram-bridge

  discord-bridge:
    image: rogerrum/alertmanager-discord:latest
    container_name: simplon_rag_discord_bridge
    environment:
      - DISCORD_WEBHOOK=${DISCORD_WEBHOOK}
      - DISCORD_USERNAME=RAG-ALERTS
    ports:
      - "9094:9094"

  telegram-bridge:
    build:
      context: ./monitoring/telegram-bridge
    container_name: simplon_rag_telegram_bridge
    environment:
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
    ports:
      - "9095:8080"

  loki:
    image: grafana/loki:latest
    container_name: simplon_rag_loki
    ports:
      - "3100:3100"
    command: -config.file=/etc/loki/local-config.yaml

  promtail:
    image: grafana/promtail:latest
    container_name: simplon_rag_promtail
    volumes:
      - /var/log:/var/log
      - ./monitoring/promtail/config.yml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki

  grafana:
    image: grafana/grafana:latest
    container_name: simplon_rag_grafana
    ports:
      - "3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus

  langfuse:
    image: langfuse/langfuse:2
    container_name: simplon_rag_langfuse
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://rag_user:rag_password@postgres:5432/rag_db
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=mysecret
      - SALT=mysalt
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
