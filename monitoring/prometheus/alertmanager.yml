global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'multi-channel'

receivers:
- name: 'multi-channel'
  webhook_configs:
  - url: 'http://discord-bridge:9094'
    send_resolved: true
  - url: 'http://telegram-bridge:8080/webhook'
    send_resolved: true
