global:
  resolve_timeout: 5m

route:
  group_by: ['alertname', 'severity']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'critical-alerts' # Default receiver
  routes:
    - match:
        severity: critical
      receiver: 'critical-alerts'
    - match:
        severity: warning
      receiver: 'warning-alerts'

receivers:
- name: 'critical-alerts'
  webhook_configs:
    - url: 'http://alert-router:8080/webhook?channels=discord,telegram'

- name: 'warning-alerts'
  webhook_configs:
    - url: 'http://alert-router:8080/webhook?channels=telegram'
