global:
  resolve_timeout: 5m

route:
  group_by: ['alertname']
  group_wait: 10s
  group_interval: 10s
  repeat_interval: 1h
  receiver: 'discord-info'
  routes:
    - match:
        severity: critical
      receiver: 'discord-prod'
    - match:
        severity: warning
      receiver: 'discord-info'

receivers:
  - name: 'discord-prod'
    discord_configs:
      - webhook_url: https://discord.com/api/webhooks/1505675788878352458/nKgNf-f2BvPpLUX6MBCQGcndLvnQEwolYPyCbgkNxJr0a8ktF2ZSN9tjcC0vGA027nKO
        title: '🚨 [PROD] {{ .GroupLabels.alertname }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'

  - name: 'discord-info'
    discord_configs:
      - webhook_url: https://discord.com/api/webhooks/1505675204095905943/qSPpIMA7nuX0hTrQL-kcCetJ4NN6723JvMqfkXjkhT0oFUValKt2IsNSP7i2KVsKYMXe
        title: '⚠️ [INFO] {{ .GroupLabels.alertname }}'
        message: '{{ range .Alerts }}{{ .Annotations.summary }}{{ end }}'