global:
  resolve_timeout: 5m

route:
  group_by: ["alertname"]
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 1h
  receiver: "discord-webhook"

receivers:
  - name: "discord-webhook"
    webhook_configs:
      - url: "http://discord-webhook-adapter:8080/webhook" # Example: using an adapter or direct webhook if supported
